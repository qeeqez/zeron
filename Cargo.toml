[package]
name = "rixlcode"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
chrono = "0.4"
gpui-kit = { version = "0.6", features = ["tree-sitter", "tree-sitter-rust", "tree-sitter-markdown", "tree-sitter-javascript", "tree-sitter-bash", "tree-sitter-toml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast-compiling profile for development iteration.
[profile.dev]
opt-level = 1

# Inherit release optimizations for test/bench builds.
[profile.release-test]
inherits = "release"
panic = "unwind"
