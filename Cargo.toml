[package]
name = "rixlcode"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Codex-style chat UI for macOS — gpui-kit frontend, codex exec backend"

[dependencies]
chrono = "0.4"
gpui-kit = { version = "0.6", features = ["tree-sitter", "tree-sitter-rust", "tree-sitter-markdown", "tree-sitter-javascript", "tree-sitter-bash", "tree-sitter-toml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
ureq = { version = "3", features = ["json"] }
portable-pty = "0.9.0"
vt100 = "0.16.2"
# Same Markdown parser gpui-base renders with — copy/quote reuse its AST so
# copied text matches the rendered bubble (see `chat_msg::copy`).
markdown = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Sidebar vibrancy: gpui-pre's Blurred window background is hardwired to
# NSVisualEffectMaterial::Selection (the weakest material), so window.rs
# installs its own NSVisualEffectView with the Sidebar material behind the
# sidebar region. Versions match gpui-pre-macos so no duplicates build.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSVisualEffectView", "NSGraphics", "NSResponder", "NSApplication", "NSImage", "NSDockTile"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-avf-audio = "0.3.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry", "NSError", "NSLocale", "NSString", "NSData"] }
objc2-speech = "0.3.2"
raw-window-handle = "0.6"

[dev-dependencies]
# `gpui` is the published gpui-pre crate under its canonical name — the
# `#[gpui_kit::test]` macro expands to `gpui::` paths, so it must resolve.
gpui = { version = "0.3.1", package = "gpui-pre", features = ["test-support"] }
# Headless UI testing: scoped queries, native input events, state snapshots.
# Re-declared here to add test-support for test builds only (features union).
gpui-kit = { version = "0.6", features = ["test-support"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast-compiling profile for development iteration.
[profile.dev]
opt-level = 1

# Inherit release optimizations for test/bench builds.
[profile.release-test]
inherits = "release"
panic = "unwind"
