[package]
name = "rixlcode"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
gpui-kit = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast-compiling profile for development iteration.
[profile.dev]
opt-level = 1

# Inherit release optimizations for test/bench builds.
[profile.release-test]
inherits = "release"
panic = "unwind"
